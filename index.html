<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SERVER THAILAND | Platform Game Online Tercepat</title>

<meta name="description" content="SERVER THAILAND menghadirkan platform game online dengan akses cepat, server stabil dan tampilan modern.">

<meta name="keywords" content="SERVER THAILAND, Server Thailand, Server Thailand Indonesia, Server Thailand Resmi, Platform Game Online">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#000;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,.15));
}

.button-area{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    z-index:2;
}

.btn{
    text-decoration:none;
    color:#fff;
    padding:16px 40px;
    border-radius:50px;
    font-size:20px;
    font-weight:bold;
    transition:.3s;
}

.login{
    background:#d60000;
}

.register{
    background:linear-gradient(180deg,#ffd700,#ff9800);
    color:#111;
}

.btn:hover{
    transform:scale(1.05);
}

@media(max-width:768px){

.button-area{
    width:90%;
    flex-direction:column;
    bottom:25px;
}

.btn{
    text-align:center;
    font-size:18px;
    padding:15px;
}

}
</style>

</head>
<body>

<section class="hero">

<img src="banner.jpg" alt="SERVER THAILAND">

<div class="button-area">
    <a href="https://example.com/login" class="btn login">LOGIN</a>
    <a href="https://example.com/daftar" class="btn register">DAFTAR</a>
</div>

</section>

</body>
</html>

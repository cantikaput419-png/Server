<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SERVER THAILAND | Platform Game Online Tercepat & Terpercaya</title>

<meta name="description" content="SERVER THAILAND menghadirkan platform game online dengan akses cepat, server stabil, aman, terpercaya dan layanan 24 jam.">

<meta name="keywords" content="
SERVER THAILAND,

Server Stabil">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#000;
overflow:hidden;
}

.hero{
width:100%;
height:100vh;
background:url(IMG-BANNER.jpg) center center/cover no-repeat;
display:flex;
justify-content:center;
align-items:flex-end;
position:relative;
}

.hero::before{
content:'';
position:absolute;
width:100%;
height:100%;
background:linear-gradient(to top,
rgba(0,0,0,.75),
rgba(0,0,0,.1));
}

.button-area{
position:relative;
z-index:2;
display:flex;
gap:20px;
margin-bottom:50px;
}

.btn{
text-decoration:none;
padding:18px 45px;
font-size:22px;
font-weight:bold;
border-radius:50px;
transition:.3s;
color:#fff;
box-shadow:0 0 20px rgba(255,215,0,.6);
}

.login{
background:#d40000;
}

.login:hover{
background:#ff2d2d;
transform:scale(1.05);
}

.register{
background:linear-gradient(#ffd700,#ff9f00);
color:#111;
}

.register:hover{
transform:scale(1.05);
}

@media(max-width:768px){

.hero{
background-position:center;
}

.button-area{
width:90%;
flex-direction:column;
margin-bottom:30px;
}

.btn{
text-align:center;
font-size:18px;
padding:16px;
}

}
</style>

</head>

<body>

<section class="hero">

<div class="button-area">

<a href="https://example.com/login" class="btn login">
LOGIN
</a>

<a href="https://example.com/daftar" class="btn register">
DAFTAR
</a>

</div>

</section>

</body>
</html>
